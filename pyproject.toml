[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-impact-lab"
version = "0.1.0"
description = "Reproducible quantization and prefix-cache experiments with quality gates"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
mac = ["mlx-lm==0.32.2", "huggingface-hub>=0.34,<2"]

[project.scripts]
inference-lab = "inference_lab.cli:main"

[tool.setuptools.packages.find]
include = ["inference_lab*"]

[project.urls]
Repository = "https://github.com/KOPRIYA/inference-impact-lab"
Issues = "https://github.com/KOPRIYA/inference-impact-lab/issues"
